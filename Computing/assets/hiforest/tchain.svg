<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">TChain across multiple HiForest files</title><desc id="desc">Corresponding trees from three files are concatenated into separate logical chains.</desc><rect width="840" height="420" rx="12" fill="#ffffff"/><text x="420" y="34" font-size="20" font-weight="650" text-anchor="middle" fill="#233044">Corresponding trees across input files</text><rect x="30" y="54" width="240" height="160" rx="7" fill="#f8fafc" stroke="#c1c9d3" stroke-width="1.2"/><text x="150" y="79" font-size="17" font-weight="600" text-anchor="middle" fill="#233044">Forest_1.root</text><rect x="45" y="90" width="210" height="30" rx="7" fill="#e5effc" stroke="#3875bb" stroke-width="1.2"/><text x="150" y="110" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Jets</text><rect x="45" y="128" width="210" height="30" rx="7" fill="#e1f3ea" stroke="#248467" stroke-width="1.2"/><text x="150" y="148" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Muons</text><rect x="45" y="166" width="210" height="30" rx="7" fill="#f7eddf" stroke="#a06c37" stroke-width="1.2"/><text x="150" y="186" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Event information</text><rect x="300" y="54" width="240" height="160" rx="7" fill="#f8fafc" stroke="#c1c9d3" stroke-width="1.2"/><text x="420" y="79" font-size="17" font-weight="600" text-anchor="middle" fill="#233044">Forest_2.root</text><rect x="315" y="90" width="210" height="30" rx="7" fill="#e5effc" stroke="#3875bb" stroke-width="1.2"/><text x="420" y="110" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Jets</text><rect x="315" y="128" width="210" height="30" rx="7" fill="#e1f3ea" stroke="#248467" stroke-width="1.2"/><text x="420" y="148" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Muons</text><rect x="315" y="166" width="210" height="30" rx="7" fill="#f7eddf" stroke="#a06c37" stroke-width="1.2"/><text x="420" y="186" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Event information</text><rect x="570" y="54" width="240" height="160" rx="7" fill="#f8fafc" stroke="#c1c9d3" stroke-width="1.2"/><text x="690" y="79" font-size="17" font-weight="600" text-anchor="middle" fill="#233044">Forest_3.root</text><rect x="585" y="90" width="210" height="30" rx="7" fill="#e5effc" stroke="#3875bb" stroke-width="1.2"/><text x="690" y="110" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Jets</text><rect x="585" y="128" width="210" height="30" rx="7" fill="#e1f3ea" stroke="#248467" stroke-width="1.2"/><text x="690" y="148" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Muons</text><rect x="585" y="166" width="210" height="30" rx="7" fill="#f7eddf" stroke="#a06c37" stroke-width="1.2"/><text x="690" y="186" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Event information</text><path d="M150 214 V234 H690 V214 M420 214 V255" stroke="#718096" stroke-width="2" fill="none"/><text x="420" y="274" font-size="16" font-weight="500" text-anchor="middle" fill="#233044">Concatenate the corresponding trees</text><rect x="30" y="288" width="780" height="32" rx="7" fill="#e5effc" stroke="#3875bb" stroke-width="1.2"/><text x="420" y="309" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Jet TChain: file 1 → file 2 → file 3</text><rect x="30" y="328" width="780" height="32" rx="7" fill="#e1f3ea" stroke="#248467" stroke-width="1.2"/><text x="420" y="349" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Muon TChain: file 1 → file 2 → file 3</text><rect x="30" y="368" width="780" height="32" rx="7" fill="#f7eddf" stroke="#a06c37" stroke-width="1.2"/><text x="420" y="389" font-size="15" font-weight="500" text-anchor="middle" fill="#233044">Event TChain: file 1 → file 2 → file 3</text></svg>
